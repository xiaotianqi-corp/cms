extend type Query {
    mediaLibraries(media_folder_id: ID @eq): [MediaLibrary!]! @paginate(defaultCount: 25) @guard
    mediaLibrary(id: ID @eq): MediaLibrary @find @guard

    productTags: [ProductTag!]! @all
    productTag(id: ID @eq): ProductTag @find

    channels: [Channel!]! @all
    channel(id: ID @eq): Channel @find

    geolocation(model_type: String! @eq, model_id: ID! @eq): Geolocation @find @guard

    taxRateRules(tax_rate_id: ID @eq): [TaxRateRule!]! @all @guard

    taxProviders: [TaxProvider!]! @all @guard
}

extend type Mutation {
    createProductTag(input: CreateProductTagInput! @spread): ProductTag! @guard @create(model: "App\\Models\\ProductTag") @can(ability: "create_product")
    updateProductTag(id: ID!, input: UpdateProductTagInput! @spread): ProductTag! @guard @update(model: "App\\Models\\ProductTag") @can(ability: "update_product", find: "id")
    deleteProductTag(id: ID!): ProductTag @guard @delete(model: "App\\Models\\ProductTag") @can(ability: "delete_product", find: "id")

    deleteMediaLibrary(id: ID!): MediaLibrary @guard @delete(model: "App\\Models\\MediaLibrary") @can(ability: "delete_media_library", find: "id")
}

type MediaLibrary {
    id: ID!
    name: String
    file_name: String!
    mime_type: String
    size: Int
    disk: String
    collection_name: String
    custom_properties: JSON
    conversions_disk: String
    folder: MediaFolder @belongsTo(relation: "mediaFolder")
    created_at: DateTime!
    updated_at: DateTime!
}

type ProductTag {
    id: ID!
    name: String!
    slug: String
    description: String
    created_at: DateTime!
    updated_at: DateTime!
}

type Channel {
    id: ID!
    name: String!
    code: String
    currency: Currency @belongsTo
    zone: Zone @belongsTo
    created_at: DateTime!
    updated_at: DateTime!
}

type Geolocation {
    id: ID!
    latitude: Float!
    longitude: Float!
    city: String
    state: String
    country: String
    ip_address: String
    model_type: String!
    model_id: ID!
    created_at: DateTime!
}

type TaxRateRule {
    id: ID!
    taxable_type: String!
    taxable_id: ID
    taxRate: TaxRate! @belongsTo(relation: "taxRate")
    zone: Zone @belongsTo
}

type TaxProvider {
    id: ID!
    name: String!
    driver: String!
    is_active: Boolean!
    settings: JSON
    created_at: DateTime!
    updated_at: DateTime!
}

input CreateProductTagInput {
    name: String!
    slug: String
    description: String
}

input UpdateProductTagInput {
    name: String
    slug: String
    description: String
}
