extend type Query {
    teams: [Team!]! @all @guard
    team(id: ID @eq): Team @find @guard

    teamInvitations: [TeamInvitation!]! @paginate(defaultCount: 25) @guard

    webhooks: [Webhook!]! @all @guard
    webhook(id: ID @eq): Webhook @find @guard

    apiKeys: [ApiKey!]! @all @guard

    roles: [Role!]! @all @guard
    role(id: ID @eq): Role @find @guard

    permissions: [Permission!]! @all @guard

    backups: [Backup!]! @paginate(defaultCount: 25) @guard
    backup(id: ID @eq): Backup @find @guard

    settings(group: String @eq, key: String @eq): [Setting!]! @paginate(defaultCount: 100) @guard

    plans: [Plan!]! @all
    plan(id: ID @eq): Plan @find

    subscriptions: [Subscription!]! @paginate(defaultCount: 25) @guard

    plugins: [Plugin!]! @all @guard

    aiInsights(model_type: String @eq, model_id: ID @eq): [AIInsight!]! @paginate(defaultCount: 25) @guard
}

extend type Mutation {
    createTeam(input: CreateTeamInput! @spread): Team! @guard @create(model: "App\\Models\\Team")
    updateTeam(id: ID!, input: UpdateTeamInput! @spread): Team! @guard @update(model: "App\\Models\\Team")
    deleteTeam(id: ID!): Team @guard @delete(model: "App\\Models\\Team")

    createWebhook(input: CreateWebhookInput! @spread): Webhook! @guard @create(model: "App\\Models\\Webhook")
    updateWebhook(id: ID!, input: UpdateWebhookInput! @spread): Webhook! @guard @update(model: "App\\Models\\Webhook")
    deleteWebhook(id: ID!): Webhook @guard @delete(model: "App\\Models\\Webhook")
}

type Team {
    id: ID!
    name: String!
    slug: String
    owner: User! @belongsTo(relation: "owner")
    members: [User!]! @belongsToMany
    invitations: [TeamInvitation!]! @hasMany
    created_at: DateTime!
    updated_at: DateTime!
}

type TeamInvitation {
    id: ID!
    email: String!
    role: String
    team: Team! @belongsTo
    created_at: DateTime!
}

type Webhook {
    id: ID!
    url: String!
    events: JSON!
    is_active: Boolean!
    secret: String
    description: String
    logs: [WebhookLog!]! @hasMany
    created_at: DateTime!
    updated_at: DateTime!
}

type WebhookLog {
    id: ID!
    event: String!
    payload: JSON
    response_status: Int
    response_body: String
    delivered_at: DateTime
    webhook: Webhook! @belongsTo
}

type ApiKey {
    id: ID!
    name: String!
    abilities: JSON!
    environment: String
    last_used_at: DateTime
    expires_at: DateTime
    created_at: DateTime!
}

type Plan {
    id: ID!
    name: String!
    slug: String
    description: String
    price: Float!
    interval: String!
    interval_count: Int!
    trial_days: Int
    features: JSON
    is_active: Boolean!
    stripe_price_id: String
    created_at: DateTime!
    updated_at: DateTime!
}

type Subscription {
    id: ID!
    name: String!
    stripe_id: String
    stripe_status: String
    stripe_price: String
    quantity: Int
    trial_ends_at: DateTime
    ends_at: DateTime
    owner: User! @morphTo
    created_at: DateTime!
    updated_at: DateTime!
}

type Plugin {
    id: ID!
    name: String!
    slug: String!
    version: String
    is_active: Boolean!
    settings: JSON
    created_at: DateTime!
    updated_at: DateTime!
}

type AIInsight {
    id: ID!
    model_type: String!
    model_id: ID!
    insight: String!
    metadata: JSON
    created_at: DateTime!
}

input CreateTeamInput {
    name: String!
    slug: String
}

input UpdateTeamInput {
    name: String
    slug: String
}

input CreateWebhookInput {
    url: String!
    events: JSON!
    is_active: Boolean
    secret: String
    description: String
}

input UpdateWebhookInput {
    url: String
    events: JSON
    is_active: Boolean
    secret: String
    description: String
}
